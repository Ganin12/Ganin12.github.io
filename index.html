<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#17142e"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Траты</title>
<style>

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.4 ui-rounded,"SF Pro Rounded",Nunito,"Segoe UI",system-ui,sans-serif;padding-bottom:150px}
main{max-width:560px;margin:0 auto;padding:18px 16px}h1{font-size:38px;line-height:1;font-weight:800;letter-spacing:-.04em;margin:6px 0 18px;text-transform:capitalize}h3{font-size:15px;font-weight:700;margin:24px 0 10px}

.hero{background:var(--ink);color:#fff;border-radius:32px;padding:22px 22px 20px;margin-bottom:12px}.hero .n{font-size:52px;line-height:1.05;font-weight:800;letter-spacing:-.04em;color:var(--sun)}.hero small{color:#b9b5dd}.hero .r{display:flex;gap:22px;margin-top:14px}.hero .r div{display:flex;flex-direction:column}.hero .r b{font-size:18px}

input,select{width:100%;padding:13px 14px;margin:0 0 8px;border:2px solid transparent;border-radius:16px;background:var(--bg);color:var(--ink);font:inherit}input:focus,select:focus{outline:0;border-color:var(--vi)}.panel input,.panel select{background:var(--bg)}input.lim{width:96px;margin:0;text-align:right}.big{font-size:34px;font-weight:800;letter-spacing:-.03em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{padding:9px 16px;border-radius:99px;background:#fff;cursor:pointer;font-weight:700;font-size:13px}.chip.on{background:var(--ink);color:#fff}
.btn,.scanb{width:100%;padding:15px;border:0;border-radius:18px;background:var(--vi);color:#fff;font:800 16px inherit;cursor:pointer;margin-top:6px}.btn.s{background:var(--ink)}.scanb{background:var(--sun);color:var(--ink);margin:0 0 12px}
nav{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;display:flex;background:var(--ink);border-radius:30px;padding:6px}nav button{flex:1;border:0;background:none;color:#b9b5dd;padding:8px 0 6px;font:700 11px inherit;border-radius:24px;cursor:pointer}nav button span{display:block;font-size:20px}nav button.on{background:var(--vi);color:#fff}
.fabs{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:center}.fabs button{border:0;border-radius:50%;cursor:pointer;box-shadow:0 8px 20px #17142e44}.f1{width:48px;height:48px;background:var(--sun);font-size:22px}.f2{width:62px;height:62px;background:var(--vi);color:#fff;font-size:34px}
.ov{display:none;position:fixed;inset:0;z-index:9}.ov.on{display:flex}#sh{background:#17142e99;align-items:flex-end}.box{width:100%;max-width:560px;margin:0 auto;background:#fff;border-radius:32px 32px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:94%;overflow:auto}.hd{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin-bottom:14px}.hd a{cursor:pointer}
#sc{background:#000;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px;padding:20px}#vid{width:100%;max-width:420px;aspect-ratio:1;object-fit:cover;border-radius:32px;border:4px solid var(--sun)}#sc label,#sc button{background:#fff;color:var(--ink);padding:12px 22px;border-radius:99px;font:700 14px inherit;border:0;cursor:pointer}
.ir{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px}.ir input{padding:10px;font-size:13px;margin-bottom:6px}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mu);font-weight:700}.bars i{width:100%;background:var(--vi);border-radius:6px 6px 2px 2px;min-height:2px}
.panel{background:#fff;border-radius:28px;padding:18px;margin-bottom:12px}.donut{width:160px;height:160px;border-radius:50%;margin:4px auto 14px;-webkit-mask:radial-gradient(circle 50px,#0000 98%,#000);mask:radial-gradient(circle 50px,#0000 98%,#000)}.lg{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0}.lg i{width:14px;height:14px;border-radius:5px;flex:none}.lg b{margin-left:auto}.stk{display:flex;height:18px;border-radius:9px;overflow:hidden;margin:4px 0 12px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:99;display:none;max-width:90%}
</style></head><body><main id="m"></main><div class="fabs"><button class="f1" onclick="openAdd();openScan()">📷</button><button class="f2" onclick="openAdd()">+</button></div>
<nav><button data-v="home" onclick="go('home')"><span>🏠</span>Главная</button><button data-v="hist" onclick="FC=null;go('hist')"><span>🕘</span>История</button><button data-v="rep" onclick="go('rep')"><span>📊</span>Отчёты</button><button data-v="cats" onclick="go('cats')"><span>🏷</span>Категории</button></nav>
<div id="sh" class="ov"></div><div id="sc" class="ov"><video id="vid" playsinline muted></video><div id="scs">Наведите камеру на QR-код чека</div><label>Выбрать фото чека<input type="file" accept="image/*" hidden onchange="fromPhoto(this.files[0])"></label><button onclick="stopScan()">Закрыть</button></div><div id="toast"></div>
<script src="jsQR.js"></script>
<script>
const K='trati_v1',$=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),R=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const DC=[{id:'tr',n:'Транспорт',i:'🚌',c:'#4cc9f0'},{id:'pr',n:'Продукты',i:'🛒',c:'#3ddc97',g:1},{id:'en',n:'Развлечения',i:'🎬',c:'#ff8fb1'},{id:'rn',n:'Квартира (аренда)',i:'🏠',c:'#ffd23f'},{id:'tx',n:'Налоги',i:'🧾',c:'#ff6b4a'},{id:'ut',n:'ЖКХ',i:'💡',c:'#ff9f1c'},{id:'he',n:'Здоровье',i:'💊',c:'#b79cff'},{id:'cl',n:'Одежда',i:'👕',c:'#c8f03c'},{id:'ot',n:'Другое',i:'📦',c:'#d4d0ea'}];
const IMP=[['Нужное','#3ddc97'],['Желательное','#ffd23f'],['Лишнее','#ff6b4a']],PAL=['#4cc9f0','#ff8fb1','#ffd23f','#b79cff','#c8f03c','#ff9f1c'];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||{cats:DC,exp:[]};S.set=S.set||{};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const cat=id=>S.cats.find(c=>c.id==id)||{n:'Другое',i:'📦',c:'#d4d0ea'},isum=i=>i.w&&i.p?i.w*i.p:(i.q||1)*(i.p||0),sum=l=>l.reduce((a,e)=>a+e.a,0);
let V='home',P='month',FC=null,sheet={it:[],m:0,raw:''};
const go=v=>{V=v;render();scrollTo(0,0)};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
function render(){$('#m').innerHTML=({home:vHome,hist:vHist,rep:vRep,cats:vCats})[V]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==V))}
function vHome(){const n=new Date(),ms=S.exp.filter(e=>{const d=new Date(e.t);return d.getMonth()==n.getMonth()&&d.getFullYear()==n.getFullYear()}),tot=sum(ms),td=sum(ms.filter(e=>new Date(e.t).getDate()==n.getDate())),lim=S.cats.reduce((a,c)=>a+(c.l||0),0);
const rows=S.cats.map(c=>({c,s:sum(ms.filter(e=>e.c==c.id))})).sort((a,b)=>b.s-a.s);
return `<h1>${n.toLocaleDateString('ru-RU',{month:'long'})}</h1><div class="hero"><small>Потрачено в этом месяце</small><div class="n">${R(tot)}</div><div class="r"><div><small>Сегодня</small><b>${R(td)}</b></div><div><small>В среднем за день</small><b>${R(tot/n.getDate())}</b></div>${lim?`<div><small>Лимиты</small><b>${R(lim)}</b></div>`:''}</div></div><div class="grid">`+rows.map(({c,s},k)=>{const p=c.l?s/c.l:tot?s/tot:0,pc=Math.round(p*100);return `<div class="tile${k==0&&s>0?' w':''}${c.l&&s>c.l?' over':''}" style="background:${c.c}" onclick="FC='${c.id}';go('hist')">${c.l&&s>c.l?'<div class="bdg">лимит превышен</div>':''}<div class="t">${E(c.n)}<span>${c.i}</span></div><div class="a">${R(s)}</div><div class="bar"><i style="width:${Math.min(100,p*100)}%"></i></div><small>${c.l?pc+'% от лимита '+R(c.l):pc+'% всех трат'}</small></div>`}).join('')+'</div>'}
function vHist(){const l=S.exp.filter(e=>!FC||e.c==FC).sort((a,b)=>b.t-a.t);let h='<h1>История</h1>'+(FC?`<div class="chips"><span class="chip on" onclick="FC=null;render()">${E(cat(FC).n)} ✕</span></div>`:'');
if(!l.length)return h+'<p class="mu">Здесь появятся ваши траты. Нажмите «+» или отсканируйте чек камерой.</p>';let last='';
l.forEach(e=>{const d=new Date(e.t),k=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}),c=cat(e.c);if(k!=last){h+=`<h3>${k}</h3>`;last=k}
h+=`<div class="row" onclick="this.classList.toggle('open')"><span class="ic" style="background:${c.c}">${c.i}</span><div class="f"><div>${E(e.p||c.n)}</div><small>${d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}, ${E(c.n)}${e.n?', '+E(e.n):''}</small></div><b>${R(e.a)}</b><div class="det">${(e.it||[]).map(i=>`<div>${E(i.n||'Позиция')}: ${i.w?`${i.w} кг × ${i.p} ₽/кг`:`${i.q||1} шт × ${i.p||0} ₽`} = ${R(isum(i))}</div>`).join('')}<div>Важность: ${IMP[e.m][0]}</div><a onclick="event.stopPropagation();del(${e.id})">Удалить</a></div></div>`});return h}
function vRep(){const n=new Date(),y=n.getFullYear(),mo=n.getMonth(),dd=n.getDate(),day=P=='week'||P=='month';
let st=P=='week'?new Date(y,mo,dd-6):P=='month'?new Date(y,mo,dd-29):P=='year'?new Date(y,mo-11,1):new Date(Math.min(n,...S.exp.map(e=>e.t)));
const l=S.exp.filter(e=>e.t>=st.getTime()),kf=t=>{const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+(day?'-'+d.getDate():'')};
let ks=[],d=new Date(st);if(!day)d.setDate(1);while(d<=n&&ks.length<400){ks.push([kf(d),new Date(d)]);day?d.setDate(d.getDate()+1):d.setMonth(d.getMonth()+1)}ks=ks.slice(-24);
const bs=ks.map(([k])=>sum(l.filter(e=>kf(e.t)==k))),mx=Math.max(...bs,1),tot=sum(l);
const cs=S.cats.map(c=>({c,s:sum(l.filter(e=>e.c==c.id))})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);let a=0;
const dn=cs.map(x=>{const f=a;a+=x.s/tot*100;return `${x.c.c} ${f}% ${a}%`}).join(','),im=IMP.map((x,i)=>sum(l.filter(e=>e.m==i)));
return `<h1>Отчёты</h1><div class="chips">${[['week','Неделя'],['month','Месяц'],['year','Год'],['all','Всё время']].map(x=>`<span class="chip${P==x[0]?' on':''}" onclick="P='${x[0]}';render()">${x[1]}</span>`).join('')}</div>
<div class="hero"><small>Потрачено за период</small><div class="n">${R(tot)}</div><small>${l.length?l.length+' трат, средняя '+R(tot/l.length):'Трат пока нет'}</small></div>
<h3>Динамика</h3><div class="panel"><div class="bars">${bs.map((v,i)=>`<div><i style="height:${v/mx*82}%"></i>${day?(i%(P=='month'?5:1)?'':ks[i][1].getDate()):ks[i][1].toLocaleDateString('ru-RU',{month:'short'}).slice(0,3)}</div>`).join('')}</div></div>
<h3>На что ушло</h3><div class="panel">${tot?`<div class="donut" style="background:conic-gradient(${dn})"></div>`+cs.map(x=>`<div class="lg"><i style="background:${x.c.c}"></i>${x.c.i} ${E(x.c.n)}<b>${R(x.s)}, ${Math.round(x.s/tot*100)}%</b></div>`).join(''):'<small>За выбранный период трат нет</small>'}</div>
<h3>Насколько это было важно</h3><div class="panel">${tot?`<div class="stk">${im.map((v,i)=>`<i style="width:${v/tot*100}%;background:${IMP[i][1]}"></i>`).join('')}</div>`+IMP.map((x,i)=>`<div class="lg"><i style="background:${x[1]}"></i>${x[0]}<b>${R(im[i])}</b></div>`).join(''):'<small>За выбранный период трат нет</small>'}</div>`}
function vCats(){return '<h1>Категории</h1>'+S.cats.map(c=>`<div class="row" style="cursor:default"><span class="ic" style="background:${c.c}">${c.i}</span><div class="f"><div>${E(c.n)}</div><small>Лимит в месяц</small></div><input class="lim" type="number" inputmode="numeric" value="${c.l||''}" placeholder="нет" onchange="setL('${c.id}',this.value)">${c.u?`<a class="lk" onclick="delC('${c.id}')">✕</a>`:''}</div>`).join('')+'<h3>Новая категория</h3><div class="panel"><input id="cn" placeholder="Название"><input id="ci" placeholder="Эмодзи" maxlength="4"><input id="cl" type="number" inputmode="numeric" placeholder="Лимит в месяц (необязательно)"><button class="btn" onclick="addC()">Добавить категорию</button></div>'+`<h3>Чеки по QR</h3><div class="panel"><small>Токен proverkacheka.com для загрузки товаров из чека. Хранится только на этом устройстве.</small><input id="tk" value="${E(S.set.tk||'')}" placeholder="Токен API" onchange="S.set.tk=this.value.trim();save()" style="margin-top:8px"></div><h3>Данные</h3><div class="panel"><small>Все траты лежат только в памяти этого браузера. Сохраняйте копию, чтобы не потерять их.</small><button class="btn s" onclick="expD()">Сохранить копию в файл</button><label><div class="btn" style="text-align:center">Загрузить копию из файла</div><input type="file" accept="application/json" hidden onchange="impD(this.files[0])"></label></div>`}
const setL=(id,v)=>{cat(id).l=parseFloat(v)||0;save()},delC=id=>{S.cats=S.cats.filter(c=>c.id!=id);save();render()},del=id=>{S.exp=S.exp.filter(e=>e.id!=id);save();render()};
function addC(){const n=$('#cn').value.trim();if(!n)return $('#cn').focus();S.cats.push({id:'c'+Date.now(),n,i:$('#ci').value||'⭐',c:PAL[S.cats.length%6],l:parseFloat($('#cl').value)||0,u:1});save();render()}
function expD(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='trati-backup.json';a.click()}
function impD(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.cats||!d.exp)throw 0;S=d;S.set=S.set||{};save();render();toast('Данные загружены')}catch(e){toast('Файл не подходит')}};r.readAsText(f)}
function openAdd(pre){pre=pre||{};const z=new Date((pre.t||Date.now())-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);sheet={it:[],m:0,raw:pre.raw||''};
$('#sh').innerHTML=`<div class="box"><div class="hd">Новая трата<a onclick="closeS()">✕</a></div><button class="scanb" onclick="openScan()">📷 Сканировать QR чека</button><div id="rs" class="mu" style="margin-bottom:8px"></div><input id="fa" class="big" type="number" inputmode="decimal" placeholder="Сумма, ₽" value="${pre.a||''}"><select id="fc" onchange="catCh()">${S.cats.map(c=>`<option value="${c.id}"${c.id==(pre.c||FC)?' selected':''}>${c.i} ${E(c.n)}</option>`).join('')}</select><input id="fp" placeholder="Где (магазин, место)"><input id="fn" placeholder="Что купили"><input id="ft" type="datetime-local" value="${z}"><div class="chips">${IMP.map((x,i)=>`<span class="chip${i?'':' on'}" onclick="sheet.m=${i};document.querySelectorAll('.box .chip').forEach((c,j)=>c.classList.toggle('on',j==${i}))">${x[0]}</span>`).join('')}</div><div id="its"></div><button class="btn" onclick="saveE()">Сохранить трату</button></div>`;$('#sh').classList.add('on');catCh()}
const closeS=()=>$('#sh').classList.remove('on');
function catCh(){$('#its').innerHTML=cat($('#fc').value).g||sheet.it.length?'<h3>Позиции</h3><div id="ir"></div><a class="lk" style="color:var(--vi)" onclick="addI()">+ добавить позицию</a><br><small>Цена за кг, если указан вес, иначе за штуку. Сумма считается сама.</small><br><br>':'';rI()}
function rI(){const r=$('#ir');if(r)r.innerHTML=sheet.it.map((x,i)=>`<div class="ir"><input placeholder="Название" value="${E(x.n||'')}" oninput="iu(${i},'n',this.value)"><input type="number" inputmode="decimal" placeholder="Кол." value="${x.q||''}" oninput="iu(${i},'q',this.value)"><input type="number" inputmode="decimal" placeholder="Вес, кг" value="${x.w||''}" oninput="iu(${i},'w',this.value)"><input type="number" inputmode="decimal" placeholder="Цена" value="${x.p||''}" oninput="iu(${i},'p',this.value)"></div>`).join('')}
const addI=()=>{sheet.it.push({});rI()};
function iu(i,k,v){sheet.it[i][k]=k=='n'?v:parseFloat(v)||0;$('#fa').value=Math.round(sheet.it.reduce((a,x)=>a+isum(x),0)*100)/100||''}
function saveE(){const a=parseFloat($('#fa').value);if(!(a>0))return $('#fa').focus();const c=$('#fc').value;
S.exp.push({id:Date.now(),t:new Date($('#ft').value).getTime()||Date.now(),a,c,p:$('#fp').value.trim(),n:$('#fn').value.trim(),m:sheet.m,rq:sheet.raw,it:cat(c).g||sheet.it.length?sheet.it.filter(x=>x.n||x.p):[]});save();closeS();render()}
/* ---- QR ---- */
function parseQR(raw){const p=new URLSearchParams(String(raw).trim()),t=p.get('t'),s=parseFloat(String(p.get('s')).replace(',','.')),m=t&&t.match(/(\d{4})-?(\d\d)-?(\d\d)T(\d\d):?(\d\d)/);return m&&s>0?{raw:String(raw).trim(),a:s,t:new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5]).getTime()}:null}
let stream,raf;const BD='BarcodeDetector' in window?new BarcodeDetector({formats:['qr_code']}):null;
async function openScan(){$('#sc').classList.add('on');$('#scs').textContent='Наведите камеру на QR-код чека';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}]}});const tr=stream.getVideoTracks()[0],cp=tr.getCapabilities?tr.getCapabilities():{};if(cp.focusMode&&cp.focusMode.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});const v=$('#vid');v.srcObject=stream;await v.play();tick()}catch(e){$('#scs').textContent='Нет доступа к камере. Разрешите её или выберите фото чека.'}}
function stopScan(){cancelAnimationFrame(raf);stream&&stream.getTracks().forEach(t=>t.stop());stream=null;$('#sc').classList.remove('on')}
async function dec(src,w,h,sides,inv){if(BD){try{const r=await BD.detect(src);if(r[0])return r[0].rawValue}catch(e){}}for(const m of sides){const k=Math.min(1,m/Math.max(w,h)),cw=Math.round(w*k),ch=Math.round(h*k),c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,cw,ch);const q=jsQR(x.getImageData(0,0,cw,ch).data,cw,ch,{inversionAttempts:inv?'attemptBoth':'dontInvert'});if(q&&q.data)return q.data}return null}
async function tick(){const v=$('#vid');if(!stream)return;if(v.videoWidth){const r=await dec(v,v.videoWidth,v.videoHeight,[1280],false);if(r&&parseQR(r))return gotQR(r)}raf=requestAnimationFrame(tick)}
async function fromPhoto(f){if(!f)return;let im;try{im=await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){im=await createImageBitmap(f)}toast('Ищу QR на фото…');const r=await dec(im,im.width,im.height,[2400,1600,1000],true);if(!r){stopScan();return toast('Не нашёл QR на фото. Снимите ближе и ровно, чтобы QR занимал большую часть кадра')}gotQR(r)}
function gotQR(raw){const r=parseQR(raw);stopScan();if(!r)return toast('QR прочитан, но это не кассовый чек: '+String(raw).slice(0,40));if(S.exp.some(e=>e.rq==r.raw))toast('Этот чек уже добавлен');openAdd({a:r.a,t:r.t,c:'pr',raw:r.raw});fetchItems(r.raw)}
async function fetchItems(raw){const st=$('#rs');if(!S.set.tk){st.textContent='Сумма и дата заполнены. Чтобы подтягивать товары, добавьте токен в разделе «Категории».';return}
st.textContent='Загружаю товары из чека…';try{const f=new FormData();f.append('token',S.set.tk);f.append('qrraw',raw);const j=await(await fetch('https://proverkacheka.com/api/v1/check/get',{method:'POST',body:f})).json(),d=j.data&&j.data.json;if(!d||!d.items)throw 0;
sheet.it=d.items.map(x=>{const q=+x.quantity||1,fr=q%1!==0;return{n:x.name,q:fr?1:q,w:fr?q:0,p:(x.price||0)/100}});$('#fp').value=d.retailPlace||d.user||'';if(d.totalSum)$('#fa').value=d.totalSum/100;catCh();st.textContent='Загружено позиций: '+sheet.it.length}
catch(e){st.textContent='Не удалось получить товары: проверьте токен, интернет и лимит запросов. Сумму и дату можно сохранить как есть.'}}
render();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
